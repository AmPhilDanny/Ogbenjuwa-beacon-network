<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a6b3a">
  <title>Resources — Ogbenjuwa</title>
  <link rel="icon" type="image/svg+xml" href="assets/ogbenjuwa-icon.svg">
  <link rel="manifest" href="assets/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="page-header">
    <div class="header-left">
      <div class="logo">
        <span class="logo-mark">🛡️</span>
        <span>Ogbenjuwa<small data-i18n="resources">Resources</small></span>
      </div>
    </div>
    <div class="header-right">
      <div class="lang-toggle">
        <button type="button" class="lang-btn" data-lang="english">EN</button>
        <button type="button" class="lang-btn" data-lang="idoma">Idoma</button>
      </div>
    </div>
  </header>

  <div class="app-shell">
    <div class="section-title"><span data-i18n="community_resources">Community resources</span></div>
    <div class="subtext muted small" data-i18n="resources_note">
      Emergency facilities, vigilante posts and help points near you.
    </div>

    <div class="filter-chips" id="type-chips">
      <button type="button" class="chip active" data-type=""><span data-i18n="all">All</span></button>
      <button type="button" class="chip" data-type="medical"><span data-i18n="medical">Medical</span></button>
      <button type="button" class="chip" data-type="shelter"><span data-i18n="shelter">Shelter</span></button>
      <button type="button" class="chip" data-type="water"><span data-i18n="water">Water</span></button>
      <button type="button" class="chip" data-type="food"><span data-i18n="food">Food</span></button>
    </div>

    <div id="resources-list" style="padding:0 12px;">
      <div class="card center muted" data-i18n="loading">Loading…</div>
    </div>
  </div>

  <script src="assets/config.js"></script>
  <script src="assets/js/session.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ws.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/resources.js"></script>
</body>
</html>
